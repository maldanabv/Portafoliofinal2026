<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MJ Digital Studio</title>
  <meta name="description" content="MJ Digital Studio — Portafolio de María José Aldana Bravo: edición de video, 3D, programación, marketing y briefs creativos.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Average+Sans&family=Rufina:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="is-loading" data-page="home" id="top">

  <!-- Preloader -->
  <div class="loader" id="loader">
    <span class="label">Cargando portafolio</span>
    <span class="loader__count">0</span>
  </div>

  <div class="cursor" id="cursor"><span></span></div>
  <header class="header" id="header"></header>
  <nav class="menu" id="menu"></nav>

  <main>
    <!-- HERO -->
    <section class="fh" id="inicio" data-cursor="Arrastrar">
      <div class="fh__media" id="fhMedia"></div>
      <h1 class="fh__title"><a class="sw-wrap" id="fhLink" href="#" data-cursor="Ver"><span id="fhTitle"></span></a></h1>
      <div class="fh__meta">
        <span class="sw-wrap"><span class="sw" id="fhYear"></span></span>
        <span class="sw-wrap"><span class="sw" id="fhCat"></span></span>
      </div>
      <div class="fh__tabs" id="fhTabs"></div>
      <div class="fh__bar">
        <span class="fh__drag">Arrastra para explorar</span>
        <div class="fh__nav">
          <button id="fhPrev" aria-label="Anterior" data-hover>←</button>
          <span>Navegar</span>
          <button id="fhNext" aria-label="Siguiente" data-hover>→</button>
        </div>
        <span>Proyecto destacado</span>
      </div>
    </section>

    <!-- PROYECTOS DESTACADOS (slider arrastrable) -->
    <div class="sec-head" id="proyectos">
      <span class="label"><span class="star">✦</span> Proyectos destacados</span>
      <span class="label">Arrastra para explorar →</span>
    </div>
    <section class="slider">
      <div class="slider__track" id="slider" data-cursor="Arrastrar"></div>
    </section>

    <!-- DECLARACIÓN -->
    <section class="statement">
      <div class="statement__side">
        <span class="label"><span class="star">✦</span> Enfoque</span>
        <a class="btn" href="#sobre-mi" data-hover>Conóceme más →</a>
      </div>
      <div>
        <h2 class="statement__text" id="statement"></h2>
      </div>
    </section>

    <!-- ARCHIVO / LISTA DE PROYECTOS -->
    <div class="sec-head">
      <span class="label"><span class="star">✦</span> Todos los proyectos</span>
      <span class="label" id="countProjects">00</span>
    </div>
    <section class="list" id="list"></section>
    <div class="list__preview" id="listPreview"></div>

    <!-- HERRAMIENTAS -->
    <section aria-label="Herramientas">
      <div class="marquee"><div class="marquee__inner"></div></div>
      <div class="marquee marquee--rev"><div class="marquee__inner"></div></div>
    </section>

    <!-- SERVICIOS -->
    <section class="services" id="servicios">
      <div>
        <span class="label"><span class="star">✦</span> Qué hago</span>
        <h2 style="margin-top:16px" data-split>Servicios y habilidades</h2>
      </div>
      <ul class="services__list" id="services"></ul>
    </section>

    <!-- SOBRE MÍ -->
    <section class="about" id="sobre-mi">
      <div class="about__photo reveal" id="aboutPhoto"></div>
      <div>
        <span class="label"><span class="star">✦</span> Sobre mí</span>
        <h2 style="margin-top:16px" id="aboutTitle" data-split></h2>
        <div class="about__text" id="aboutText"></div>
        <div class="about__actions" id="aboutActions"></div>
      </div>
    </section>

    <!-- TRAYECTORIA -->
    <section class="timeline">
      <h2 data-split>Trayectoria</h2>
      <ul id="timeline"></ul>
    </section>
  </main>

  <footer class="footer" id="contacto"></footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
